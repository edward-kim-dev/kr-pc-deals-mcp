<form name="main_search" method="post" action="/shop/product_search.html" target="_parent">
                						<input type="text" name="main_search" class="input" value="RTX 5070"/>
                						<a href="javascript:document.main_search.submit()" class="search_btn"></a>
                					</form>
<script type="text/javascript">
	$(function(){		
		$(".opt").click(function(){
			$("[id=search_cate]").filter(".on").each(function(obj){
				$(this).removeClass("on");
			});
			$(this).addClass("on");
			searchListAjax();
			return false;
		});

		$(".more_btn").click(function(){
			var src = $(this).find("img").attr("src");
			var more_view = $(this).parent().next().find(".opt_more");
			var temp = "";
			if(more_view.length > 0){
				if(more_view.is(":visible")){
					more_view.slideUp();
					temp = src.replace("close","open");
				}else{
					more_view.slideDown();
					temp = src.replace("open","close");
				}
				$(this).find("img").attr("src",temp)
			}
			return false;
		});
		
		$(".nav .curr").hover(function(){
			$(this).find(".nav_sub").show();
		},function(){
			$(this).find(".nav_sub").hide();
		});
	
		//엔터 이벤트
		var arr = new Array("#search", "#search1","#eprice"); 
		for (var i=0;i<arr.length;i++){
			$(arr[i]).keydown(function(key) {
				if (key.keyCode == 13) searchListAjax();
			});
		}
		$("#sprice").keydown(function(key) {
			if (key.keyCode == 13) {				
				$("#eprice").focus();
				return true;
			}
		});

		searchListAjax();
	});

	function searchListAjax(){
		var search_cate= "";
		$("[id=search_cate]").filter(".on").each(function(obj){
			search_cate = $(this).attr("nodeValue");
		});
			
		var url = '/skin/shop/basic/product_list_include_plist.php';		var r = Math.random()*1000000;		
		loading_layer(true);
		$.ajax({
			type:"POST",
			url: url,	
			data:{
				sort : sort,
				action : "pc_estimate_keyword",
				search_word : "RTX 5070",
				search1 : $("#search1").val(),
				search_query : $("#search_query").val(),
				search_cate : search_cate,
				sprice  : $("#sprice").val(),
				eprice  : $("#eprice").val(),
				page    : $("#page").val(),
				list_sort_type : $("#list_sort_type").val(),
				view_type : $("#view_type").val(),
				timeid : r
			},
			success: function(html){
				$("#product_list").html(html);			
				// 견적서 탭일시
				if($(".pc_estimate").length == 1){
					if($(".product > li").length < 30){
						$(".detail_more").removeClass("on");
					}
					kings_score_graph();
				}
				$("#filterArea").find(".cnt").html($("#total_num").val());										
				loading_layer(false);
			} 
		});
	}
	
	function pageReplace(order){
		$("#page").val(1);
		$("#list_sort_type").val(order);
		searchListAjax();
	}

	function pageMove(num){
		$("#page").val(num);
		searchListAjax();
	}

	function chViewType(viewType){
		$("#view_type").val(viewType);		
		searchListAjax();
	}

	function searchTab(val){
		document.myform.search_tab.value = val;
		document.myform.submit();
	}


// ----------------
// 견적서 검색용
// ----------------
	var sort = ['','','','X'];		
	function search_list_sort(i,name,val){
		sort[i] = val;	
		searchListAjax();
	}
</script>
